<svg viewBox="0 0 160 220" width="160" height="220" xmlns="http://www.w3.org/2000/svg">
  <!-- RÉCEPTEUR RX ELRS 2.4G (VUE DU DESSUS STYLE MULTI-MOTORS NOIR & BLANC SANS OMBRE) -->
  <g id="rx-top-view">
    <!-- PCB miniature rectangulaire blanc -->
    <rect x="24" y="24" width="112" height="172" rx="6" fill="#ffffff" stroke="#000000" stroke-width="3" />
    
    <!-- Connecteur antenne micro-coaxial IPEX / U.FL doré étamé en haut -->
    <circle cx="80" cy="50" r="12" fill="#ffffff" stroke="#000000" stroke-width="2" />
    <circle cx="80" cy="50" r="6" fill="#000000" />
    <circle cx="80" cy="50" r="2.5" fill="#ffffff" />

    <!-- Puce principale MCU ESP8285 / Semtech SX1280 -->
    <rect x="46" y="80" width="68" height="56" rx="3" fill="#000000" stroke="#000000" stroke-width="2" />
    <circle cx="54" cy="88" r="2" fill="#ffffff" />
    <text x="80" y="108" text-anchor="middle" font-family="system-ui, monospace, sans-serif" font-size="8" font-weight="900" fill="#ffffff">
      ELRS
    </text>
    <text x="80" y="122" text-anchor="middle" font-family="system-ui, monospace, sans-serif" font-size="7" font-weight="bold" fill="#ffffff">
      2.4GHz
    </text>

    <!-- Bouton Boot / Bind & LED -->
    <circle cx="56" cy="154" r="4.5" fill="#000000" stroke="#000000" stroke-width="1.5" />
    <circle cx="56" cy="154" r="2" fill="#ffffff" />
    <circle cx="70" cy="154" r="3" fill="#000000" />

    <!-- 4 Pads de soudure en bas (5V, GND, TX, RX) -->
    <g stroke="#000000" stroke-width="1.8">
      <rect x="36" y="174" width="16" height="22" rx="3" fill="#000000" />
      <text x="44" y="189" font-family="monospace" font-size="7" font-weight="bold" fill="#ffffff" text-anchor="middle">5V</text>

      <rect x="58" y="174" width="16" height="22" rx="3" fill="#000000" />
      <text x="66" y="189" font-family="monospace" font-size="7" font-weight="bold" fill="#ffffff" text-anchor="middle">G</text>

      <rect x="80" y="174" width="16" height="22" rx="3" fill="#ffffff" />
      <text x="88" y="189" font-family="monospace" font-size="7" font-weight="bold" fill="#000000" text-anchor="middle">TX</text>

      <rect x="102" y="174" width="16" height="22" rx="3" fill="#ffffff" />
      <text x="110" y="189" font-family="monospace" font-size="7" font-weight="bold" fill="#000000" text-anchor="middle">RX</text>
    </g>
  </g>
</svg>