<svg viewBox="0 0 160 200" width="160" height="200" xmlns="http://www.w3.org/2000/svg">
  <!-- CAMÉRA FPV MICRO 19X19 (FIDÈLE À CAMERA.PNG - VUE DU DESSUS STYLE MULTI-MOTORS 100% NOIR & BLANC SANS OMBRE) -->
  <g id="camera-top-view">
    
    <!-- 1. PARE-SOLEIL ET LENTILLE FRONTALE (AVANT) -->
    <!-- Bord extérieur du cylindre d'objectif M12 -->
    <rect x="52" y="10" width="56" height="32" rx="4" fill="#000000" stroke="#000000" stroke-width="2" />
    <!-- Lentille optique frontale traitée antireflet -->
    <circle cx="80" cy="26" r="18" fill="#ffffff" stroke="#000000" stroke-width="2.5" />
    <circle cx="80" cy="26" r="12" fill="#27272a" stroke="#000000" stroke-width="2" />
    <circle cx="80" cy="26" r="6" fill="#000000" />
    <circle cx="82" cy="24" r="2" fill="#ffffff" />

    <!-- 2. BAGUE DE MISE AU POINT CRANTÉE (FOCUS RING) -->
    <rect x="56" y="42" width="48" height="24" fill="#ffffff" stroke="#000000" stroke-width="2" />
    
      <rect x="60" y="42" width="2.5" height="24" fill="#000000" />
    
      <rect x="65" y="42" width="2.5" height="24" fill="#000000" />
    
      <rect x="70" y="42" width="2.5" height="24" fill="#000000" />
    
      <rect x="75" y="42" width="2.5" height="24" fill="#000000" />
    
      <rect x="80" y="42" width="2.5" height="24" fill="#000000" />
    
      <rect x="85" y="42" width="2.5" height="24" fill="#000000" />
    
      <rect x="90" y="42" width="2.5" height="24" fill="#000000" />
    
      <rect x="95" y="42" width="2.5" height="24" fill="#000000" />
    
      <rect x="100" y="42" width="2.5" height="24" fill="#000000" />
    

    <!-- 3. CÔNE MÉTALLIQUE DE RACCORDEMENT USINÉ -->
    <path
      d="M 56 66 L 36 102 L 124 102 L 104 66 Z"
      fill="#ffffff"
      stroke="#000000"
      stroke-width="3"
      stroke-linejoin="round"
    />
    <line x1="44" y1="84" x2="116" y2="84" stroke="#000000" stroke-width="1.5" stroke-dasharray="4 2" />

    <!-- 4. BOÎTIER PRINCIPAL EN MAGNÉSIUM / ALUMINIUM 19X19 -->
    <rect x="30" y="102" width="100" height="70" rx="6" fill="#ffffff" stroke="#000000" stroke-width="3.5" />
    
    <!-- Pattes de fixation latérales arrondies avec perçage M2 pour inclinaison -->
    <!-- Patte Gauche -->
    <path d="M 30 114 C 18 114, 14 124, 14 135 C 14 146, 18 156, 30 156 Z" fill="#ffffff" stroke="#000000" stroke-width="3" />
    <circle cx="24" cy="135" r="5" fill="#000000" />
    <circle cx="24" cy="135" r="2" fill="#ffffff" />
    
    <!-- Patte Droite -->
    <path d="M 130 114 C 142 114, 146 124, 146 135 C 146 146, 142 156, 130 156 Z" fill="#ffffff" stroke="#000000" stroke-width="3" />
    <circle cx="136" cy="135" r="5" fill="#000000" />
    <circle cx="136" cy="135" r="2" fill="#ffffff" />

    <!-- 5. PLAQUE ARRIÈRE CAPTEUR & CONNECTEUR JST-GH -->
    <!-- Plaque arrière noire du capteur CMOS -->
    <rect x="34" y="166" width="92" height="12" rx="2" fill="#000000" />
    <!-- Prise connecteur 3 broches (GND, 5V, VIDEO) sortant à l'arrière -->
    <rect x="65" y="178" width="30" height="14" rx="2" fill="#ffffff" stroke="#000000" stroke-width="2" />
    <line x1="72" y1="184" x2="72" y2="198" stroke="#000000" stroke-width="2" />
    <line x1="80" y1="184" x2="80" y2="198" stroke="#000000" stroke-width="2" />
    <line x1="88" y1="184" x2="88" y2="198" stroke="#000000" stroke-width="2" />

    <!-- Marquage technique laser sur le capot -->
    <text x="80" y="132" text-anchor="middle" font-family="monospace, sans-serif" font-size="8.5" font-weight="900" fill="#000000" letter-spacing="1">
      FPV 1200TVL
    </text>
    <text x="80" y="146" text-anchor="middle" font-family="monospace, sans-serif" font-size="7" font-weight="bold" fill="#52525b" letter-spacing="0.5">
      M12 • WDR 16:9
    </text>
  </g>
</svg>