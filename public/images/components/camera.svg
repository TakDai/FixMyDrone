<svg viewBox="0 0 200 180" width="200" height="180" xmlns="http://www.w3.org/2000/svg">
  <!-- CAMÉRA FPV MICRO 19x19 (VUE DU DESSUS STYLE MULTI-MOTORS NOIR & BLANC SANS OMBRE) -->
  <g id="camera-top-view">
    <!-- Objectif / lentille optique frontale M12 pointant vers le haut -->
    <rect x="75" y="10" width="50" height="42" rx="4" fill="#ffffff" stroke="#000000" stroke-width="3" />
    <circle cx="100" cy="26" r="18" fill="#ffffff" stroke="#000000" stroke-width="2.5" />
    <circle cx="100" cy="26" r="12" fill="#000000" stroke="#000000" stroke-width="2" />
    <circle cx="100" cy="26" r="5" fill="#ffffff" />
    <!-- Bague de mise au point crantée -->
    <line x1="82" y1="42" x2="118" y2="42" stroke="#000000" stroke-width="2" stroke-dasharray="3 3" />

    <!-- Boîtier principal en aluminium usiné 19x19 -->
    <rect x="60" y="52" width="80" height="80" rx="6" fill="#ffffff" stroke="#000000" stroke-width="3.5" />
    <rect x="68" y="60" width="64" height="64" rx="4" fill="#fcfcfc" stroke="#000000" stroke-width="1.5" stroke-dasharray="4 3" />

    <!-- Supports de fixation latéraux gauche et droite avec vis M2 -->
    <g stroke="#000000" stroke-width="2.5" fill="#ffffff">
      <path d="M 60 76 L 36 76 L 36 108 L 60 108 Z" rx="2" />
      <circle cx="48" cy="92" r="5" fill="#000000" />
      <circle cx="48" cy="92" r="2" fill="#ffffff" />

      <path d="M 140 76 L 164 76 L 164 108 L 140 108 Z" rx="2" />
      <circle cx="152" cy="92" r="5" fill="#000000" />
      <circle cx="152" cy="92" r="2" fill="#ffffff" />
    </g>

    <!-- Connecteur 3-pins arrière JST-GH -->
    <rect x="85" y="132" width="30" height="14" rx="2" fill="#000000" stroke="#000000" stroke-width="2" />
    <line x1="93" y1="146" x2="93" y2="158" stroke="#000000" stroke-width="2" />
    <line x1="100" y1="146" x2="100" y2="158" stroke="#000000" stroke-width="2" />
    <line x1="107" y1="146" x2="107" y2="158" stroke="#000000" stroke-width="2" />

    <text x="100" y="96" text-anchor="middle" font-family="system-ui, monospace, sans-serif" font-size="8.5" font-weight="900" fill="#000000">
      FPV 1200TVL
    </text>
  </g>
</svg>