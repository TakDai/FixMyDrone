<svg viewBox="0 0 500 115" width="500" height="115" xmlns="http://www.w3.org/2000/svg">
  <!-- ANTENNE IMMORTAL-T COMPLETE AVEC BRINS DIPÔLES, CÂBLE COAXIAL RG178 ET CONNECTEUR IPEX U.FL -->
  <g id="antenna-rx-top-view">
    
    <!-- 1. CÂBLE COAXIAL RG178 SOUPLE AVEC COURBURE NATURELLE VERS LE RÉCEPTEUR RX -->
    <!-- Gaine extérieure noire du câble coaxial -->
    <path
      d="M 250 56 
         C 250 82, 275 98, 312 98 
         C 350 98, 378 82, 386 64"
      fill="none"
      stroke="#000000"
      stroke-width="5"
      stroke-linecap="round"
    />
    <!-- Liseré de contraste interne blanc sur le câble coaxial -->
    <path
      d="M 250 56 
         C 250 82, 275 98, 312 98 
         C 350 98, 378 82, 386 64"
      fill="none"
      stroke="#ffffff"
      stroke-width="1.6"
      stroke-linecap="round"
    />

    <!-- 2. CONNECTEUR MINIATURE IPEX / U.FL EN BOUT DE CÂBLE -->
    <g transform="translate(386, 64) rotate(-35)">
      <!-- Manchon de sertissage / bague de blindage métallique -->
      <rect x="-4" y="-3" width="8" height="7" rx="1" fill="#000000" />
      <!-- Tête ronde du connecteur U.FL (prise femelle clipsable sur le récepteur RX) -->
      <circle cx="0" cy="-12" r="8" fill="#ffffff" stroke="#000000" stroke-width="2.5" />
      <circle cx="0" cy="-12" r="5" fill="#000000" />
      <circle cx="0" cy="-12" r="2" fill="#ffffff" />
      <!-- Ergot de verrouillage mécanique -->
      <rect x="-2" y="-21" width="4" height="3" fill="#000000" rx="0.5" />
    </g>

    <!-- 3. BRINS DIPÔLES HORIZONTAUX GAUCHE ET DROITE EN ACIER INOX -->
    <line x1="25" y1="28" x2="222" y2="28" stroke="#000000" stroke-width="5" stroke-linecap="round" />
    <line x1="278" y1="28" x2="475" y2="28" stroke="#000000" stroke-width="5" stroke-linecap="round" />

    <!-- Embouts en caoutchouc de protection aux deux extrémités -->
    <rect x="12" y="20" width="18" height="16" rx="5" fill="#000000" />
    <circle cx="16" cy="28" r="2.5" fill="#ffffff" />
    <rect x="470" y="20" width="18" height="16" rx="5" fill="#000000" />
    <circle cx="484" cy="28" r="2.5" fill="#ffffff" />

    <!-- 4. BAGUES / MANCHONS DE REPÉRAGE NOIRS -->
    <g fill="#000000" stroke="#000000" stroke-width="1.5">
      <!-- Manchon gauche -->
      <rect x="208" y="19" width="18" height="18" rx="3" fill="#ffffff" stroke="#000000" stroke-width="2" />
      <rect x="212" y="21" width="10" height="14" rx="2" fill="#000000" />
      
      <!-- Manchon droit -->
      <rect x="274" y="19" width="18" height="18" rx="3" fill="#ffffff" stroke="#000000" stroke-width="2" />
      <rect x="278" y="21" width="10" height="14" rx="2" fill="#000000" />
    </g>

    <!-- 5. CORPS CENTRAL SURMOULÉ TPU EN TÉ RENFORCÉ -->
    <path
      d="M 226 16 
         L 274 16 
         C 282 16, 288 20, 288 28 
         C 288 36, 280 40, 272 40 
         L 258 40 
         C 256 46, 254 52, 253 58 
         L 247 58 
         C 246 52, 244 46, 242 40 
         L 228 40 
         C 220 40, 212 36, 212 28 
         C 212 20, 218 16, 226 16 Z"
      fill="#ffffff"
      stroke="#000000"
      stroke-width="3"
      stroke-linejoin="round"
    />
    <!-- Orifice central de fixation -->
    <circle cx="250" cy="28" r="6" fill="#000000" />
    <circle cx="250" cy="28" r="2.5" fill="#ffffff" />

  </g>
</svg>
