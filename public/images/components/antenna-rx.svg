<svg viewBox="0 0 500 65" width="500" height="65" xmlns="http://www.w3.org/2000/svg">
  <!-- ANTENNE IMMORTAL-T TBS / ELRS (FIDÈLE À ANTENNA-RX.PNG - STYLE MULTI-MOTORS 100% NOIR & BLANC SANS OMBRE) -->
  <g id="antenna-rx-top-view">
    
    <!-- 1. BRINS DIPÔLES HORIZONTAUX GAUCHE ET DROITE EN ACIER INOX -->
    <line x1="25" y1="32" x2="220" y2="32" stroke="#000000" stroke-width="5" stroke-linecap="round" />
    <line x1="280" y1="32" x2="475" y2="32" stroke="#000000" stroke-width="5" stroke-linecap="round" />

    <!-- Embouts en caoutchouc aux deux extrémités -->
    <rect x="12" y="24" width="18" height="16" rx="5" fill="#000000" />
    <circle cx="16" cy="32" r="2.5" fill="#ffffff" />
    <rect x="470" y="24" width="18" height="16" rx="5" fill="#000000" />
    <circle cx="484" cy="32" r="2.5" fill="#ffffff" />

    <!-- 2. BAGUES / MANCHONS DE REPÉRAGE NOIRS -->
    <g fill="#000000" stroke="#000000" stroke-width="1.5">
      <!-- Manchon gauche -->
      <rect x="208" y="23" width="18" height="18" rx="3" fill="#ffffff" stroke="#000000" stroke-width="2" />
      <rect x="212" y="25" width="10" height="14" rx="2" fill="#000000" />
      
      <!-- Manchon droit -->
      <rect x="274" y="23" width="18" height="18" rx="3" fill="#ffffff" stroke="#000000" stroke-width="2" />
      <rect x="278" y="25" width="10" height="14" rx="2" fill="#000000" />
    </g>

    <!-- 3. CORPS CENTRAL SURMOULÉ TPU EN TÉ -->
    <path
      d="M 226 20 
         L 274 20 
         C 282 20, 288 24, 288 32 
         C 288 40, 280 44, 272 44 
         L 258 44 
         C 256 50, 254 55, 253 58 
         L 247 58 
         C 246 55, 244 50, 242 44 
         L 228 44 
         C 220 44, 212 40, 212 32 
         C 212 24, 218 20, 226 20 Z"
      fill="#ffffff"
      stroke="#000000"
      stroke-width="3"
      stroke-linejoin="round"
    />
    <circle cx="250" cy="32" r="6" fill="#000000" />
    <circle cx="250" cy="32" r="2.5" fill="#ffffff" />
  </g>
</svg>