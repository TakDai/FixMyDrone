<svg viewBox="0 0 150 70" width="150" height="70" xmlns="http://www.w3.org/2000/svg">
  <!-- CONDENSATEUR CHIMIQUE LOW ESR EN VUE COUCHÉE (VUE LATÉRALE HORIZONTALE - STYLE MULTI-MOTORS NOIR & BLANC SANS OMBRE) -->
  <g id="condo-side-view">
    
    <!-- 1. PATTES MÉTALLIQUES ÉTAMÉES (ANODE + ET CATHODE -) SORTANT VERS LA DROITE -->
    <!-- Patte négative (-) supérieure -->
    <line x1="114" y1="26" x2="142" y2="26" stroke="#000000" stroke-width="3.2" stroke-linecap="round" />
    
    <!-- Patte positive (+) inférieure (légèrement plus longue comme en réalité) -->
    <line x1="114" y1="44" x2="147" y2="44" stroke="#000000" stroke-width="3.2" stroke-linecap="round" />

    <!-- 2. BOUCHON EN CAOUTCHOUC / ÉLASTOMÈRE ISOLANT (RUBBER SEAL) -->
    <rect x="108" y="16" width="8" height="38" rx="2" fill="#18181b" stroke="#000000" stroke-width="2" />
    <line x1="112" y1="18" x2="112" y2="52" stroke="#3f3f46" stroke-width="1" />

    <!-- 3. FOND EMBOUTI EN ALUMINIUM (CÔTÉ GAUCHE DU CYLINDRE) -->
    <path
      d="M 22 13 
         C 14 13, 8 22, 8 35 
         C 8 48, 14 57, 22 57 Z"
      fill="#ffffff"
      stroke="#000000"
      stroke-width="3.5"
      stroke-linejoin="round"
    />
    <!-- Rainure de relief sur le dôme en aluminium -->
    <path
      d="M 18 18 
         C 13 23, 13 47, 18 52"
      fill="none"
      stroke="#000000"
      stroke-width="1.5"
    />

    <!-- 4. CORPS DU CYLINDRE (CANETTE ENROBÉE DE GAINE THERMORÉRACTABLE) -->
    <rect x="22" y="13" width="86" height="44" fill="#ffffff" stroke="#000000" stroke-width="3.5" />

    <!-- Gorge de sertissage périphérique (cannelure mécanique) -->
    <line x1="98" y1="14" x2="98" y2="56" stroke="#000000" stroke-width="2" />
    <line x1="96" y1="14" x2="96" y2="56" stroke="#d4d4d8" stroke-width="1" />

    <!-- 5. BANDELETTE DE POLARITÉ NÉGATIVE (-) NOIRE AVEC SYMBOLES BLANCS -->
    <rect x="23" y="15" width="84" height="13" fill="#000000" stroke="#000000" stroke-width="0.5" />
    
    <!-- Symboles négatifs (-) réguliers le long de la bande -->
    <rect x="36" y="20.5" width="8" height="2" fill="#ffffff" rx="0.5" />
    <rect x="54" y="20.5" width="8" height="2" fill="#ffffff" rx="0.5" />
    <rect x="72" y="20.5" width="8" height="2" fill="#ffffff" rx="0.5" />
    <rect x="90" y="20.5" width="5" height="2" fill="#ffffff" rx="0.5" />

    <!-- 6. LIGNES TECHNIQUES DE RELIEF CAD -->
    <!-- Ligne de reflet supérieure -->
    <line x1="24" y1="33" x2="94" y2="33" stroke="#e4e4e7" stroke-width="1.8" />
    
    <!-- Ligne de relief inférieure technique -->
    <line x1="24" y1="49" x2="94" y2="49" stroke="#000000" stroke-width="1.2" stroke-dasharray="4 3" opacity="0.6" />

  </g>
</svg>
