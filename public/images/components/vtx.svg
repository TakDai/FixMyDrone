    <!-- Prise d'antenne MMCX / SMA en haut -->
    <g transform="translate(100, 20)">
      <rect x="-12" y="0" width="24" height="20" rx="3" fill="#ffffff" stroke="#000000" stroke-width="2.5" />
      <circle cx="0" cy="8" r="6" fill="#000000" />
      <circle cx="0" cy="8" r="2.5" fill="#ffffff" />
    </g>

    <!-- Radiateur thermique en aluminium avec ailettes horizontales usinées -->
    <rect x="36" y="40" width="128" height="160" rx="6" fill="#ffffff" stroke="#000000" stroke-width="3.5" />
    
      <rect x="46" y="54" width="108" height="7" rx="1.5" fill="#000000" />
    
      <rect x="46" y="68" width="108" height="7" rx="1.5" fill="#000000" />
    
      <rect x="46" y="82" width="108" height="7" rx="1.5" fill="#000000" />
    
      <rect x="46" y="96" width="108" height="7" rx="1.5" fill="#000000" />
    
      <rect x="46" y="110" width="108" height="7" rx="1.5" fill="#000000" />
    
      <rect x="46" y="124" width="108" height="7" rx="1.5" fill="#000000" />
    
      <rect x="46" y="138" width="108" height="7" rx="1.5" fill="#000000" />
    
      <rect x="46" y="152" width="108" height="7" rx="1.5" fill="#000000" />
    
      <rect x="46" y="166" width="108" height="7" rx="1.5" fill="#000000" />
    

    <!-- Affichage digital LED canaux & bouton poussoir -->
    <rect x="52" y="184" width="28" height="12" rx="2" fill="#000000" />
    <text x="66" y="193" text-anchor="middle" font-family="monospace" font-size="8" font-weight="bold" fill="#ffffff">CH1</text>

    <!-- Bouton Band / Power -->
    <circle cx="144" cy="190" r="5" fill="#ffffff" stroke="#000000" stroke-width="2" />
    <circle cx="144" cy="190" r="2" fill="#000000" />

    <!-- Connecteur 6 broches bas (7-26V, GND, Video, SmartAudio, 5V Out) -->
    <rect x="76" y="200" width="48" height="14" rx="2" fill="#000000" stroke="#000000" stroke-width="2" />
    
      <line x1="83" y1="214" x2="83" y2="228" stroke="#000000" stroke-width="1.8" />
    
      <line x1="90" y1="214" x2="90" y2="228" stroke="#000000" stroke-width="1.8" />
    
      <line x1="97" y1="214" x2="97" y2="228" stroke="#000000" stroke-width="1.8" />
    
      <line x1="104" y1="214" x2="104" y2="228" stroke="#000000" stroke-width="1.8" />
    
      <line x1="111" y1="214" x2="111" y2="228" stroke="#000000" stroke-width="1.8" />
    
      <line x1="118" y1="214" x2="118" y2="228" stroke="#000000" stroke-width="1.8" />
    

  </g>
