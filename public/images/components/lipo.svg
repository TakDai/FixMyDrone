<svg viewBox="0 0 160 380" width="160" height="380" xmlns="http://www.w3.org/2000/svg">
  <!-- PACK BATTERIE LIPO 6S (FIDÈLE À LIPO.PNG - STYLE MULTI-MOTORS 100% NOIR & BLANC SANS OMBRE) -->
  <g id="lipo-top-view">
    
    <!-- 1. GROS CÂBLES D'ALIMENTATION SILICONE 12AWG COURBÉS NATURELLEMENT (COMME DANS LIPO.PNG) -->
    <!-- Câble Négatif (-) Noir courbé vers la prise XT60 -->
    <path
      d="M 56 145 
         C 48 95, 34 58, 48 35 
         C 54 24, 60 21, 69 21"
      fill="none"
      stroke="#000000"
      stroke-width="10"
      stroke-linecap="round"
    />
    <!-- Liseré de contraste interne blanc sur le câble noir -->
    <path
      d="M 56 145 
         C 48 95, 34 58, 48 35 
         C 54 24, 60 21, 69 21"
      fill="none"
      stroke="#ffffff"
      stroke-width="2.5"
      stroke-linecap="round"
    />

    <!-- Câble Positif (+) Rouge courbé vers la prise XT60 (en monochrome : hachuré / gris foncé) -->
    <path
      d="M 104 145 
         C 112 95, 116 58, 100 36 
         C 88 25, 78 28, 72 31"
      fill="none"
      stroke="#000000"
      stroke-width="10"
      stroke-linecap="round"
    />
    <path
      d="M 104 145 
         C 112 95, 116 58, 100 36 
         C 88 25, 78 28, 72 31"
      fill="none"
      stroke="#27272a"
      stroke-width="6"
      stroke-linecap="round"
      stroke-dasharray="6 3"
    />

    <!-- 2. CONNECTEUR AMASS XT60 FEMELLE PARFAITEMENT INTÉGRÉ DANS LE VIEWBOX SANS AUCUN ROGNAGE -->
    <g transform="translate(24, 25) rotate(-12)">
      <!-- Corps de la prise XT60 avec chanfrein anti-inversion -->
      <path
        d="M 0 0 L 36 0 L 36 22 L 8 22 L 0 14 Z"
        fill="#ffffff"
        stroke="#000000"
        stroke-width="2.5"
      />
      <!-- Alvéoles des 2 fiches dorées 4mm -->
      <circle cx="12" cy="11" r="5" fill="#000000" />
      <circle cx="12" cy="11" r="2" fill="#ffffff" />
      <circle cx="26" cy="11" r="5" fill="#000000" />
      <circle cx="26" cy="11" r="2" fill="#ffffff" />
      <!-- Bague thermorétractable noire à la base des câbles -->
      <rect x="36" y="2" width="10" height="18" rx="2" fill="#000000" />
    </g>

    <!-- 3. PRISE D'ÉQUILIBRAGE JST-XH 7 BROCHES (POUR LES 6 CELLULES) -->
    <g transform="translate(110, 100) rotate(18)">
      <rect x="0" y="0" width="34" height="14" rx="2" fill="#ffffff" stroke="#000000" stroke-width="2" />
      
        <line x1="4" y1="3" x2="4" y2="11" stroke="#000000" stroke-width="1.2" />
      
        <line x1="8.2" y1="3" x2="8.2" y2="11" stroke="#000000" stroke-width="1.2" />
      
        <line x1="12.4" y1="3" x2="12.4" y2="11" stroke="#000000" stroke-width="1.2" />
      
        <line x1="16.6" y1="3" x2="16.6" y2="11" stroke="#000000" stroke-width="1.2" />
      
        <line x1="20.8" y1="3" x2="20.8" y2="11" stroke="#000000" stroke-width="1.2" />
      
        <line x1="25" y1="3" x2="25" y2="11" stroke="#000000" stroke-width="1.2" />
      
        <line x1="29.200000000000003" y1="3" x2="29.200000000000003" y2="11" stroke="#000000" stroke-width="1.2" />
      
    </g>

    <!-- 4. CORPS DU PACK LIPO (CELLULES SOUS GAINE THERMORÉRACTABLE) -->
    <!-- Boîtier rectangulaire avec coins arrondis -->
    <rect x="30" y="145" width="100" height="225" rx="8" fill="#ffffff" stroke="#000000" stroke-width="4" />
    
    <!-- Rebord supérieur de rétraction de la gaine -->
    <path d="M 30 155 Q 80 162 130 155" stroke="#000000" stroke-width="2" fill="none" />
    <path d="M 34 148 L 126 148" stroke="#000000" stroke-width="1.5" stroke-dasharray="4 2" />

    <!-- Séparation des 6 cellules pouch à l'intérieur -->
    
      <line x1="32" y1="180" x2="128" y2="180" stroke="#000000" stroke-width="1.2" stroke-dasharray="6 4" />
    
      <line x1="32" y1="216" x2="128" y2="216" stroke="#000000" stroke-width="1.2" stroke-dasharray="6 4" />
    
      <line x1="32" y1="252" x2="128" y2="252" stroke="#000000" stroke-width="1.2" stroke-dasharray="6 4" />
    
      <line x1="32" y1="288" x2="128" y2="288" stroke="#000000" stroke-width="1.2" stroke-dasharray="6 4" />
    
      <line x1="32" y1="324" x2="128" y2="324" stroke="#000000" stroke-width="1.2" stroke-dasharray="6 4" />
    

    <!-- Plaque de protection en aluminium / fibre anti-écrasement -->
    <rect x="38" y="170" width="84" height="42" rx="4" fill="#000000" />
    <rect x="42" y="174" width="76" height="34" rx="2" fill="#18181b" stroke="#3f3f46" stroke-width="1" />

    <!-- Zone de texture grip antidérapante -->
    <rect x="40" y="235" width="80" height="75" rx="3" fill="#ffffff" stroke="#000000" stroke-width="1.5" stroke-dasharray="4 4" />
  </g>
</svg>