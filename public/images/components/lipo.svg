<svg viewBox="0 0 160 380" width="160" height="380" xmlns="http://www.w3.org/2000/svg">
  <!-- BATTERIE LIPO 6S 1300MAH (VUE DU DESSUS STYLE MULTI-MOTORS NOIR & BLANC SANS OMBRE) -->
  <g id="lipo-top-view">
    <!-- Câbles d'alimentation sortant par le haut -->
    <!-- Câble principal 12AWG avec prise XT60 jaune/noire étamée -->
    <path d="M 60 70 C 60 40, 50 30, 42 20" fill="none" stroke="#000000" stroke-width="7" stroke-linecap="round" />
    <path d="M 75 70 C 75 40, 85 30, 95 20" fill="none" stroke="#000000" stroke-width="7" stroke-linecap="round" />
    
    <!-- Prise XT60 Amass femelle -->
    <rect x="25" y="4" width="40" height="18" rx="3" fill="#ffffff" stroke="#000000" stroke-width="3" />
    <circle cx="37" cy="13" r="3.5" fill="#000000" />
    <circle cx="53" cy="13" r="3.5" fill="#000000" />

    <!-- Prise d'équilibrage JST-XH 7 broches (6S) -->
    <rect x="95" y="8" width="44" height="14" rx="2" fill="#ffffff" stroke="#000000" stroke-width="2" />
    
      <line x1="101" y1="10" x2="101" y2="20" stroke="#000000" stroke-width="1.2" />
    
      <line x1="106.2" y1="10" x2="106.2" y2="20" stroke="#000000" stroke-width="1.2" />
    
      <line x1="111.4" y1="10" x2="111.4" y2="20" stroke="#000000" stroke-width="1.2" />
    
      <line x1="116.6" y1="10" x2="116.6" y2="20" stroke="#000000" stroke-width="1.2" />
    
      <line x1="121.8" y1="10" x2="121.8" y2="20" stroke="#000000" stroke-width="1.2" />
    
      <line x1="127" y1="10" x2="127" y2="20" stroke="#000000" stroke-width="1.2" />
    
      <line x1="132.2" y1="10" x2="132.2" y2="20" stroke="#000000" stroke-width="1.2" />
    

    <!-- Corps du pack LiPo 6 cellules sous gaine thermorétractable -->
    <rect x="20" y="70" width="120" height="290" rx="8" fill="#ffffff" stroke="#000000" stroke-width="4" />
    
    <!-- Séparations internes des 6 cellules pouch superposées -->
    
      <line x1="22" y1="120" x2="138" y2="120" stroke="#000000" stroke-width="1.5" stroke-dasharray="6 4" />
    
      <line x1="22" y1="164" x2="138" y2="164" stroke="#000000" stroke-width="1.5" stroke-dasharray="6 4" />
    
      <line x1="22" y1="208" x2="138" y2="208" stroke="#000000" stroke-width="1.5" stroke-dasharray="6 4" />
    
      <line x1="22" y1="252" x2="138" y2="252" stroke="#000000" stroke-width="1.5" stroke-dasharray="6 4" />
    
      <line x1="22" y1="296" x2="138" y2="296" stroke="#000000" stroke-width="1.5" stroke-dasharray="6 4" />
    

    <!-- Plaquette de protection aluminium contre les chocs -->
    <rect x="32" y="85" width="96" height="45" rx="4" fill="#000000" />
    <text x="80" y="105" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="900" fill="#ffffff" letter-spacing="1.5">
      6S 22.2V
    </text>
    <text x="80" y="122" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="900" fill="#ffffff" letter-spacing="1">
      1300mAh • 150C
    </text>

    <!-- Zone grip velcro anti-dérapante -->
    <rect x="32" y="190" width="96" height="100" rx="4" fill="#ffffff" stroke="#000000" stroke-width="2" stroke-dasharray="4 4" />
    <text x="80" y="245" text-anchor="middle" font-family="system-ui, monospace, sans-serif" font-size="9" font-weight="bold" fill="#000000">
      HIGH DISCHARGE GRAPHENE
    </text>
  </g>
</svg>