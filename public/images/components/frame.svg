<svg viewBox="0 0 600 520" width="600" height="520" xmlns="http://www.w3.org/2000/svg">
  <!-- ==========================================================================
       CHÂSSIS CARBONE TRUE-X 5" (FIDÈLE À FRAME.PNG & FIGMA-EXPLODED-DRONE.PNG)
       STYLE MULTI-MOTORS 100% CAD VECTORIEL NOIR & BLANC SANS OMBRE
       ========================================================================== -->
  <defs>
    <!-- Trame subtile carbone tissé 3K Twill (Monochrome pur) -->
    <pattern id="carbon-weave" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect width="6" height="6" fill="#18181b" />
      <rect x="0" y="0" width="3" height="3" fill="#27272a" />
      <rect x="3" y="3" width="3" height="3" fill="#27272a" />
      <line x1="0" y1="3" x2="6" y2="3" stroke="#09090b" stroke-width="0.5" />
      <line x1="3" y1="0" x2="3" y2="6" stroke="#09090b" stroke-width="0.5" />
    </pattern>

    <!-- Modèle de vis BTR hexagonale M3 fraisée (Vue de dessus CAD) -->
    <g id="screw-btr">
      <circle cx="0" cy="0" r="5.5" fill="#27272a" stroke="#000000" stroke-width="1.2" />
      <circle cx="0" cy="0" r="4.2" fill="#09090b" />
      <!-- Empreinte 6 pans creux (clé Allen) -->
      <polygon points="0,-2.6 2.25,-1.3 2.25,1.3 0,2.6 -2.25,1.3 -2.25,-1.3" fill="#ffffff" stroke="#27272a" stroke-width="0.5" />
    </g>

    <!-- Modèle de vis Standoff M3 tête ronde avec rondelle alu -->
    <g id="screw-standoff">
      <circle cx="0" cy="0" r="4.5" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
      <circle cx="0" cy="0" r="3.2" fill="#18181b" />
      <polygon points="0,-1.8 1.6,-0.9 1.6,0.9 0,1.8 -1.6,0.9 -1.6,-0.9" fill="#ffffff" />
    </g>

    <!-- Modèle de plot standoff alu visible entre plaques -->
    <g id="standoff-barrel">
      <circle cx="0" cy="0" r="4" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
      <circle cx="0" cy="0" r="2" fill="#71717a" />
      <circle cx="0" cy="0" r="1" fill="#000000" />
    </g>

    <!-- PAD MOTEUR AVEC BUMPERS CRASH-PROTECTION (EXACT SELON FRAME.PNG) -->
    <!-- Pad Avant-Gauche : Protections vers le haut (-Y) et vers la gauche (-X) -->
    <g id="motor-mount-fl">
      <!-- Contour monobloc carbone usiné CNC avec bumpers -->
      <path
        d="M -6 18 
           C -16 16, -23 8, -23 -3
           L -33 -3 
           C -37 -3, -40 -6, -40 -10 
           L -40 -18 
           C -40 -22, -37 -25, -33 -25 
           L -21 -25 
           C -18 -25, -15 -23, -15 -20 
           L -15 -25 
           C -15 -29, -12 -32, -8 -32 
           L 0 -32 
           C 4 -32, 7 -29, 7 -25 
           L 7 -18 
           C 18 -18, 26 -10, 26 0 
           C 26 12, 17 22, 5 23 
           Z"
        fill="url(#carbon-weave)"
        stroke="#000000"
        stroke-width="2.5"
        stroke-linejoin="round"
      />
      <!-- Chanfrein intérieur CNC 45° -->
      <path
        d="M -5 15 C -14 13, -20 6, -20 -3 L -31 -3 C -34 -3, -37 -5, -37 -9 L -37 -17 C -37 -20, -34 -22, -31 -22 L -20 -22 L -13 -22 L -13 -25 C -13 -27, -11 -29, -8 -29 L 0 -29 C 3 -29, 5 -27, 5 -25 L 5 -16 C 15 -16, 23 -8, 23 0 C 23 10, 15 19, 4 20 Z"
        fill="none"
        stroke="#3f3f46"
        stroke-width="1"
      />
      <!-- Trou central d'axe moteur (passage circlip 9mm) -->
      <circle cx="0" cy="0" r="8.5" fill="#ffffff" stroke="#000000" stroke-width="2" />
      <circle cx="0" cy="0" r="4.5" fill="none" stroke="#27272a" stroke-width="1" stroke-dasharray="2 2" />

      <!-- 4 fentes de fixation moteur 16x16 / 19x19mm -->
      <g fill="#ffffff" stroke="#000000" stroke-width="1.5">
        <!-- Trou Haut-Gauche (-11, -11) -->
        <rect x="-13" y="-13" width="4" height="4" rx="2" transform="rotate(45 -11 -11)" />
        <!-- Trou Haut-Droit (11, -11) -->
        <rect x="9" y="-13" width="4" height="4" rx="2" transform="rotate(-45 11 -11)" />
        <!-- Trou Bas-Gauche (-11, 11) -->
        <rect x="-13" y="9" width="4" height="4" rx="2" transform="rotate(-45 -11 11)" />
        <!-- Trou Bas-Droit (11, 11) -->
        <rect x="9" y="9" width="4" height="4" rx="2" transform="rotate(45 11 11)" />
      </g>

      <!-- Lumières d'allègement / passage rislan dans les bumpers -->
      <rect x="-35" y="-18" width="5" height="9" rx="2" fill="#ffffff" stroke="#000000" stroke-width="1.2" />
      <rect x="-5" y="-27" width="8" height="5" rx="2" fill="#ffffff" stroke="#000000" stroke-width="1.2" />
    </g>
  </defs>

  <g id="drone-frame-assembly">

    <!-- ======================================================================
         1. LES 4 BRAS CARBONE MASSIFS 5MM (VUE DE DESSOUS/TRAVERSANTE)
         ====================================================================== -->
    <g id="carbon-arms">
      <!-- Bras Avant-Gauche (du centre 300,260 vers 75,75) -->
      <path
        d="M 280 240 
           L 95 82 
           C 90 77, 85 75, 75 75 
           L 70 85 
           L 260 270 Z"
        fill="url(#carbon-weave)"
        stroke="#000000"
        stroke-width="2.5"
      />
      <!-- Ligne de chanfrein intérieur du bras -->
      <line x1="275" y1="244" x2="93" y2="86" stroke="#3f3f46" stroke-width="1.2" />
      <line x1="264" y1="266" x2="74" y2="92" stroke="#3f3f46" stroke-width="1.2" />

      <!-- Bras Avant-Droit (du centre 300,260 vers 525,75) -->
      <path
        d="M 320 240 
           L 505 82 
           C 510 77, 515 75, 525 75 
           L 530 85 
           L 340 270 Z"
        fill="url(#carbon-weave)"
        stroke="#000000"
        stroke-width="2.5"
      />
      <line x1="325" y1="244" x2="507" y2="86" stroke="#3f3f46" stroke-width="1.2" />
      <line x1="336" y1="266" x2="526" y2="92" stroke="#3f3f46" stroke-width="1.2" />

      <!-- Bras Arrière-Gauche (du centre 300,260 vers 75,445) -->
      <path
        d="M 260 250 
           L 70 435 
           L 75 445 
           C 85 445, 90 443, 95 438 
           L 280 280 Z"
        fill="url(#carbon-weave)"
        stroke="#000000"
        stroke-width="2.5"
      />
      <line x1="264" y1="254" x2="74" y2="428" stroke="#3f3f46" stroke-width="1.2" />
      <line x1="275" y1="276" x2="93" y2="434" stroke="#3f3f46" stroke-width="1.2" />

      <!-- Bras Arrière-Droit (du centre 300,260 vers 525,445) -->
      <path
        d="M 340 250 
           L 530 435 
           L 525 445 
           C 515 445, 510 443, 505 438 
           L 320 280 Z"
        fill="url(#carbon-weave)"
        stroke="#000000"
        stroke-width="2.5"
      />
      <line x1="336" y1="254" x2="526" y2="428" stroke="#3f3f46" stroke-width="1.2" />
      <line x1="325" y1="276" x2="507" y2="434" stroke="#3f3f46" stroke-width="1.2" />
    </g>

    <!-- ======================================================================
         2. LES 4 PADS MOTEURS AVEC BUMPERS CRASH-PROTECTION USINÉS
         ====================================================================== -->
    <!-- Avant-Gauche (75, 75) -->
    <g transform="translate(75, 75)">
      <use href="#motor-mount-fl" />
    </g>

    <!-- Avant-Droit (525, 75) - Miroir horizontal -->
    <g transform="translate(525, 75) scale(-1, 1)">
      <use href="#motor-mount-fl" />
    </g>

    <!-- Arrière-Gauche (75, 445) - Miroir vertical -->
    <g transform="translate(75, 445) scale(1, -1)">
      <use href="#motor-mount-fl" />
    </g>

    <!-- Arrière-Droit (525, 445) - Double miroir -->
    <g transform="translate(525, 445) scale(-1, -1)">
      <use href="#motor-mount-fl" />
    </g>

    <!-- ======================================================================
         3. ENTRETOISES ALUMINIUM (STANDOFFS) VISIBLES SUR LES CÔTÉS
         ====================================================================== -->
    <g id="visible-standoffs">
      <use href="#standoff-barrel" x="256" y="148" />
      <use href="#standoff-barrel" x="344" y="148" />
      <use href="#standoff-barrel" x="254" y="260" />
      <use href="#standoff-barrel" x="346" y="260" />
      <use href="#standoff-barrel" x="256" y="372" />
      <use href="#standoff-barrel" x="344" y="372" />
    </g>

    <!-- ======================================================================
         4. TOP PLATE CARBONE DU FUSELAGE CENTRAL (EXACT DE FRAME.PNG)
         ====================================================================== -->
    <g id="top-plate">
      <!-- Silhouette extérieure usinée CNC de la plaque supérieure -->
      <path
        d="M 270 20 
           L 282 20 
           C 285 28, 292 32, 300 32 
           C 308 32, 315 28, 318 20 
           L 330 20 
           C 336 20, 340 25, 340 32 
           L 340 140 
           C 340 148, 348 156, 348 166 
           L 348 354 
           C 348 364, 340 372, 340 380 
           L 340 488 
           C 340 495, 336 500, 330 500 
           L 318 500 
           C 315 492, 308 488, 300 488 
           C 292 488, 285 492, 282 500 
           L 270 500 
           C 264 500, 260 495, 260 488 
           L 260 380 
           C 260 372, 252 364, 252 354 
           L 252 166 
           C 252 156, 260 148, 260 140 
           L 260 32 
           C 260 25, 264 20, 270 20 Z"
        fill="url(#carbon-weave)"
        stroke="#000000"
        stroke-width="3"
        stroke-linejoin="round"
      />

      <!-- Chanfrein intérieur de la top plate (Biseau 45° CNC) -->
      <path
        d="M 272 23 
           L 283 23 
           C 286 29, 292 34, 300 34 
           C 308 34, 314 29, 317 23 
           L 328 23 
           C 333 23, 337 27, 337 33 
           L 337 139 
           C 337 146, 345 154, 345 165 
           L 345 355 
           C 345 366, 337 374, 337 381 
           L 337 487 
           C 337 493, 333 497, 328 497 
           L 317 497 
           C 314 491, 308 486, 300 486 
           C 292 486, 286 491, 283 497 
           L 272 497 
           C 267 497, 263 493, 263 487 
           L 263 381 
           C 263 374, 255 366, 255 355 
           L 255 165 
           C 255 154, 263 146, 263 139 
           L 263 33 
           C 263 27, 267 23, 272 23 Z"
        fill="none"
        stroke="#3f3f46"
        stroke-width="1.2"
      />
    </g>

    <!-- ======================================================================
         5. TOUTES LES DÉCOUPES ET AJOURAGES TECHNIQUES (BLANC TRAVERSANT)
         ====================================================================== -->
    <g id="top-plate-cutouts" fill="#ffffff" stroke="#000000" stroke-width="1.8" stroke-linejoin="round">
      
      <!-- SECTION AVANT (CAMÉRA & SANGLE HD) -->
      <!-- Fentes longitudinales de sangle / caméra -->
      <rect x="268" y="52" width="7" height="42" rx="3.5" />
      <rect x="325" y="52" width="7" height="42" rx="3.5" />

      <!-- Découpe centrale en sablier / double-triangle (X) -->
      <polygon points="284,55 316,55 300,72" />
      <polygon points="300,75 316,92 284,92" />

      <!-- SECTION CENTRALE (STACK FC / ESC 30.5x30.5 & 20x20) -->
      <!-- Découpe en 'X' supérieure au-dessus du contrôleur -->
      <polygon points="280,165 294,185 280,205 290,205 300,190 310,205 320,205 306,185 320,165 310,165 300,180 290,165" />

      <!-- Découpe centrale 'X' avec puits circulaire central traversant -->
      <polygon points="278,225 292,245 282,245 272,230" />
      <polygon points="322,225 308,245 318,245 328,230" />
      <polygon points="282,275 292,275 278,295 272,290" />
      <polygon points="318,275 308,275 322,295 328,290" />
      
      <!-- Puits circulaire central (accès axe moteur / connecteur / câbles) -->
      <circle cx="300" cy="260" r="14" />

      <!-- Découpe en 'X' inférieure sous le contrôleur -->
      <polygon points="280,315 294,335 280,355 290,355 300,340 310,355 320,355 306,335 320,315 310,315 300,330 290,315" />

      <!-- SECTION ARRIÈRE (BATTERIE LIPO & VTX) -->
      <!-- Découpe triangulaire supérieure arrière -->
      <polygon points="285,385 315,385 300,402" />

      <!-- Fentes longitudinales de passage sangle LiPo 20mm -->
      <rect x="268" y="415" width="7" height="44" rx="3.5" />
      <rect x="325" y="415" width="7" height="44" rx="3.5" />

      <!-- Découpe triangulaire inférieure arrière -->
      <polygon points="300,422 315,442 285,442" />
    </g>

    <!-- Détail interne du puits central -->
    <circle cx="300" cy="260" r="6" fill="#18181b" stroke="#000000" stroke-width="1.5" />

    <!-- ======================================================================
         6. VISSERIE BTR FRAISÉE & VIS STANDOFFS (FIDÈLE À FRAME.PNG)
         ====================================================================== -->
    <g id="screws">
      <!-- 2 Vis Standoffs Avant (Plaque caméra) -->
      <use href="#screw-standoff" x="274" y="36" />
      <use href="#screw-standoff" x="326" y="36" />

      <!-- 2 Vis Standoffs Transition Avant -->
      <use href="#screw-standoff" x="270" y="146" />
      <use href="#screw-standoff" x="330" y="146" />

      <!-- 4 Vis BTR de serrage des bras carbone (Stack Center 30.5x30.5) -->
      <use href="#screw-btr" x="274" y="210" />
      <use href="#screw-btr" x="326" y="210" />
      <use href="#screw-btr" x="274" y="310" />
      <use href="#screw-btr" x="326" y="310" />

      <!-- 2 Vis Standoffs Transition Arrière -->
      <use href="#screw-standoff" x="270" y="374" />
      <use href="#screw-standoff" x="330" y="374" />

      <!-- 2 Vis Standoffs Arrière (Queue de fuselage) -->
      <use href="#screw-standoff" x="274" y="484" />
      <use href="#screw-standoff" x="326" y="484" />
    </g>

  </g>
</svg>
