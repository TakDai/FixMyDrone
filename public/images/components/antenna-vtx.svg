<svg viewBox="0 0 80 400" width="80" height="400" xmlns="http://www.w3.org/2000/svg">
  <!-- ==========================================================================
       ANTENNE VTX 5.8GHz RHCP LOLLIPOP / PAGODA (FIDÈLE À ANTENNA-VTX.PNG)
       STYLE MULTI-MOTORS 100% CAD VECTORIEL NOIR & BLANC SANS OMBRE
       ========================================================================== -->
  <g id="antenna-vtx-assembly">

    <!-- 1. TÊTE RADOME OMNIDIRECTIONNELLE 5.8GHz (LOLLIPOP / RHCP CAP) -->
    <!-- Coque extérieure du radôme avec dôme supérieur arrondi -->
    <path
      d="M 18 36 
         C 18 18, 28 12, 40 12 
         C 52 12, 62 18, 62 36 
         L 62 56 
         C 62 60, 58 62, 54 62 
         L 26 62 
         C 22 62, 18 60, 18 56 
         Z"
      fill="#18181b"
      stroke="#000000"
      stroke-width="2.5"
      stroke-linejoin="round"
    />

    <!-- Reflet spéculaire d'arête CAD blanc sur le dôme supérieur -->
    <path
      d="M 24 30 
         C 24 20, 31 16, 40 16 
         C 49 16, 56 20, 56 30"
      fill="none"
      stroke="#ffffff"
      stroke-width="2"
      stroke-linecap="round"
    />

    <!-- Ligne de plan de jointure de moule / soudure ultrasonique -->
    <line x1="20" y1="50" x2="60" y2="50" stroke="#3f3f46" stroke-width="1.2" stroke-dasharray="4 2" />

    <!-- Collerette inférieure du radôme -->
    <path
      d="M 28 62 L 52 62 L 49 70 L 31 70 Z"
      fill="#27272a"
      stroke="#000000"
      stroke-width="1.5"
    />

    <!-- 2. MANCHON DE DÉCHARGE DE TRACTION CONIQUE EN TPU -->
    <path
      d="M 32 70 L 48 70 L 46 84 L 34 84 Z"
      fill="#3f3f46"
      stroke="#000000"
      stroke-width="1.5"
    />
    <line x1="33" y1="74" x2="47" y2="74" stroke="#ffffff" stroke-width="1" />
    <line x1="34" y1="79" x2="46" y2="79" stroke="#ffffff" stroke-width="1" />

    <!-- 3. TUBE DE MAINTIEN RIGIDE NOIR (GAINE THERMORÉTRACTABLE 80MM) -->
    <rect
      x="34"
      y="84"
      width="12"
      height="92"
      rx="2"
      fill="#18181b"
      stroke="#000000"
      stroke-width="2"
    />
    <!-- Liseré de contraste vertical central blanc -->
    <line x1="40" y1="87" x2="40" y2="173" stroke="#52525b" stroke-width="1.5" stroke-dasharray="6 4" />

    <!-- Bague de sertissage basse de la gaine rigide -->
    <path
      d="M 34 176 L 46 176 L 43 184 L 37 184 Z"
      fill="#27272a"
      stroke="#000000"
      stroke-width="1.5"
    />

    <!-- 4. CÂBLE COAXIAL RG178 / RG402 SOUPLE NOIR -->
    <line x1="40" y1="184" x2="40" y2="350" stroke="#000000" stroke-width="4.5" stroke-linecap="round" />
    <line x1="40" y1="184" x2="40" y2="350" stroke="#27272a" stroke-width="2" stroke-linecap="round" />

    <!-- 5. CONNECTEUR D'ANTENNE MMCX DROIT / U.FL EN LAITON (BAS DE ANTENNA-VTX.PNG) -->
    <!-- Bague de sertissage supérieure du câble -->
    <rect x="36" y="350" width="8" height="6" rx="1" fill="#e4e4e7" stroke="#000000" stroke-width="1.2" />

    <!-- Corps principal moleté du connecteur MMCX -->
    <rect x="33" y="356" width="14" height="24" rx="2" fill="#ffffff" stroke="#000000" stroke-width="2" />
    <!-- Rainures de préhension moletées -->
    <line x1="33" y1="361" x2="47" y2="361" stroke="#000000" stroke-width="1.2" />
    <line x1="33" y1="366" x2="47" y2="366" stroke="#000000" stroke-width="1.2" />
    <line x1="33" y1="371" x2="47" y2="371" stroke="#000000" stroke-width="1.2" />
    <line x1="33" y1="376" x2="47" y2="376" stroke="#000000" stroke-width="1.2" />

    <!-- Bague de verrouillage clip / collerette dorée (monochrome CAD) -->
    <rect x="35" y="380" width="10" height="6" rx="1" fill="#27272a" stroke="#000000" stroke-width="1.2" />

    <!-- Broche centrale et collerette d'insertion MMCX -->
    <circle cx="40" cy="390" r="3.5" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
    <circle cx="40" cy="390" r="1.5" fill="#000000" />

  </g>
</svg>
