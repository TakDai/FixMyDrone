<svg viewBox="0 0 100 400" width="100" height="400" xmlns="http://www.w3.org/2000/svg">
  <!-- ANTENNE VTX RHCP LOLLIPOP (VUE DU DESSUS/AXIALE STYLE MULTI-MOTORS NOIR & BLANC SANS OMBRE) -->
  <g id="antenna-vtx-top-view">
    <!-- Câble coaxial semi-rigide RG402 noir avec gaine thermorétractable -->
    <line x1="50" y1="90" x2="50" y2="340" stroke="#000000" stroke-width="9" stroke-linecap="round" />
    <line x1="50" y1="90" x2="50" y2="340" stroke="#ffffff" stroke-width="2.5" />

    <!-- Connecteur SMA mâle en laiton moleté en bas -->
    <rect x="36" y="340" width="28" height="45" rx="3" fill="#ffffff" stroke="#000000" stroke-width="3.5" />
    <line x1="38" y1="352" x2="62" y2="352" stroke="#000000" stroke-width="2" />
    <line x1="38" y1="364" x2="62" y2="364" stroke="#000000" stroke-width="2" />
    <line x1="38" y1="374" x2="62" y2="374" stroke="#000000" stroke-width="2" />
    <circle cx="50" cy="385" r="3.5" fill="#000000" />

    <!-- Tête champignon Lollipop / cloche de polarisation circulaire RHCP -->
    <circle cx="50" cy="50" r="38" fill="#ffffff" stroke="#000000" stroke-width="4" />
    <circle cx="50" cy="50" r="30" fill="#ffffff" stroke="#000000" stroke-width="1.8" stroke-dasharray="6 3" />
    
    <!-- Motifs des 4 lobes de trèfle polarisés en croix -->
    <g transform="rotate(0 50 50)">
        <ellipse cx="50" cy="32" rx="8" ry="12" fill="#000000" />
      </g>
    <g transform="rotate(90 50 50)">
        <ellipse cx="50" cy="32" rx="8" ry="12" fill="#000000" />
      </g>
    <g transform="rotate(180 50 50)">
        <ellipse cx="50" cy="32" rx="8" ry="12" fill="#000000" />
      </g>
    <g transform="rotate(270 50 50)">
        <ellipse cx="50" cy="32" rx="8" ry="12" fill="#000000" />
      </g>

    <circle cx="50" cy="50" r="10" fill="#ffffff" stroke="#000000" stroke-width="2.5" />
    <circle cx="50" cy="50" r="4" fill="#000000" />
  </g>
</svg>