<svg viewBox="0 0 180 180" width="180" height="180" xmlns="http://www.w3.org/2000/svg">
  <!-- MODULE GPS M10 & COMPASS (VUE DU DESSUS STYLE MULTI-MOTORS NOIR & BLANC SANS OMBRE) -->
  <g id="gps-top-view">
    <!-- PCB porteur carré blanc -->
    <rect x="18" y="18" width="144" height="144" rx="8" fill="#ffffff" stroke="#000000" stroke-width="3.5" />
    
    <!-- Antenne patch céramique carrée centrale (avec découpe et point d'alimentation) -->
    <rect x="36" y="36" width="108" height="108" rx="6" fill="#f4f4f5" stroke="#000000" stroke-width="3" />
    
    <!-- Surface argentée de l'antenne patch -->
    <rect x="46" y="46" width="88" height="88" rx="4" fill="#ffffff" stroke="#000000" stroke-width="1.8" stroke-dasharray="6 3" />
    
    <!-- Point d'injection RF métallisé (Feed pin décentré) -->
    <circle cx="82" cy="74" r="5" fill="#000000" stroke="#000000" stroke-width="1.5" />
    <circle cx="82" cy="74" r="2" fill="#ffffff" />

    <!-- Puce boussole magnétomètre QMC5883L -->
    <rect x="110" y="112" width="18" height="16" rx="1.5" fill="#000000" />
    <circle cx="114" cy="116" r="1.5" fill="#ffffff" />

    <!-- LEDs de statut FIX & POWER -->
    <circle cx="48" cy="138" r="3" fill="#000000" stroke="#000000" stroke-width="1.5" />
    <circle cx="58" cy="138" r="3" fill="#ffffff" stroke="#000000" stroke-width="1.5" />

    <!-- Sérigraphie M10 COMPASS -->
    <text x="90" y="102" text-anchor="middle" font-family="system-ui, monospace, sans-serif" font-size="11" font-weight="900" fill="#000000" letter-spacing="1">
      M10 GPS
    </text>
  </g>
</svg>