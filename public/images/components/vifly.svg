<svg viewBox="0 0 120 180" width="120" height="180" xmlns="http://www.w3.org/2000/svg">
  <!-- BUZZER AUTONOME VIFLY FINDER (VUE DU DESSUS STYLE MULTI-MOTORS NOIR & BLANC SANS OMBRE) -->
  <g id="vifly-top-view">
    <!-- Boîtier rectangulaire compact blanc -->
    <rect x="15" y="15" width="90" height="150" rx="6" fill="#ffffff" stroke="#000000" stroke-width="3.5" />
    
    <!-- Disque piézoélectrique sonore haute puissance 105dB en haut -->
    <circle cx="60" cy="62" r="34" fill="#ffffff" stroke="#000000" stroke-width="3" />
    <circle cx="60" cy="62" r="26" fill="#000000" />
    <!-- Trou acoustique central -->
    <circle cx="60" cy="62" r="8" fill="#ffffff" stroke="#000000" stroke-width="2" />

    <!-- Bouton de désarmement tactile -->
    <rect x="36" y="112" width="48" height="20" rx="4" fill="#ffffff" stroke="#000000" stroke-width="2" />
    <circle cx="60" cy="122" r="5" fill="#000000" />
    <text x="60" y="141" text-anchor="middle" font-family="system-ui, sans-serif" font-size="6.5" font-weight="bold" fill="#000000">DISARM</text>

    <!-- LED stroboscopique de repérage nocturne -->
    <circle cx="90" cy="122" r="3.5" fill="#000000" />

    <!-- 3 Fils de branchement (5V, GND, BZ-) -->
    <rect x="42" y="165" width="36" height="12" rx="2" fill="#000000" stroke="#000000" stroke-width="1.5" />
    <line x1="48" y1="177" x2="48" y2="185" stroke="#000000" stroke-width="2" />
    <line x1="60" y1="177" x2="60" y2="185" stroke="#000000" stroke-width="2" />
    <line x1="72" y1="177" x2="72" y2="185" stroke="#000000" stroke-width="2" />
  </g>
</svg>