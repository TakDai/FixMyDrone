<svg viewBox="0 0 300 300" width="300" height="300" xmlns="http://www.w3.org/2000/svg">
  <!-- ESC 4-EN-1 55A (VUE DU DESSUS STYLE MULTI-MOTORS NOIR & BLANC SANS OMBRE) -->
  <g id="esc-top-view">
    <!-- PCB principal carré blanc à coins arrondis -->
    <path
      d="M 52 16 L 248 16 C 272 16, 284 28, 284 52 L 284 248 C 284 272, 272 284, 248 284 L 52 284 C 28 284, 16 272, 16 248 L 16 52 C 16 28, 28 16, 52 16 Z"
      fill="#ffffff"
      stroke="#000000"
      stroke-width="3.5"
      stroke-linejoin="round"
    />

    <!-- Ligne de plan de masse en pointillés -->
    <path
      d="M 54 24 L 246 24 C 266 24, 276 34, 276 54 L 276 246 C 276 266, 266 276, 246 276 L 54 276 C 34 276, 24 266, 24 246 L 24 54 C 24 34, 34 24, 54 24 Z"
      fill="#fcfcfc"
      stroke="#000000"
      stroke-width="1.2"
      stroke-dasharray="6 4"
    />

    <!-- 4 Œillets silicone aux coins (30.5x30.5) -->
    
      <g transform="translate(48, 48)">
        <circle cx="0" cy="0" r="18" fill="#000000" />
        <circle cx="0" cy="0" r="12" fill="#27272a" stroke="#000000" stroke-width="1.5" />
        <circle cx="0" cy="0" r="7.5" fill="#ffffff" stroke="#000000" stroke-width="2" />
        <circle cx="0" cy="0" r="3.5" fill="#000000" />
      </g>
    
      <g transform="translate(252, 48)">
        <circle cx="0" cy="0" r="18" fill="#000000" />
        <circle cx="0" cy="0" r="12" fill="#27272a" stroke="#000000" stroke-width="1.5" />
        <circle cx="0" cy="0" r="7.5" fill="#ffffff" stroke="#000000" stroke-width="2" />
        <circle cx="0" cy="0" r="3.5" fill="#000000" />
      </g>
    
      <g transform="translate(48, 252)">
        <circle cx="0" cy="0" r="18" fill="#000000" />
        <circle cx="0" cy="0" r="12" fill="#27272a" stroke="#000000" stroke-width="1.5" />
        <circle cx="0" cy="0" r="7.5" fill="#ffffff" stroke="#000000" stroke-width="2" />
        <circle cx="0" cy="0" r="3.5" fill="#000000" />
      </g>
    
      <g transform="translate(252, 252)">
        <circle cx="0" cy="0" r="18" fill="#000000" />
        <circle cx="0" cy="0" r="12" fill="#27272a" stroke="#000000" stroke-width="1.5" />
        <circle cx="0" cy="0" r="7.5" fill="#ffffff" stroke="#000000" stroke-width="2" />
        <circle cx="0" cy="0" r="3.5" fill="#000000" />
      </g>
    

    <!-- PADS MOTEURS SUR LES CÔTÉS GAUCHE ET DROIT (GROS PADS CUIVRE/OR ÉTAMÉS) -->
    <!-- Côté Gauche : Moteur 1 (Haut) et Moteur 2 (Bas) -->
    <g stroke="#000000" stroke-width="2">
      <!-- M1 (3 phases A, B, C) -->
      <rect x="17" y="78" width="18" height="15" rx="3" fill="#ffffff" />
      <rect x="17" y="98" width="18" height="15" rx="3" fill="#ffffff" />
      <rect x="17" y="118" width="18" height="15" rx="3" fill="#ffffff" />
      <text x="26" y="90" font-family="monospace" font-size="7" font-weight="900" text-anchor="middle">M1</text>

      <!-- M2 (3 phases A, B, C) -->
      <rect x="17" y="167" width="18" height="15" rx="3" fill="#ffffff" />
      <rect x="17" y="187" width="18" height="15" rx="3" fill="#ffffff" />
      <rect x="17" y="207" width="18" height="15" rx="3" fill="#ffffff" />
      <text x="26" y="179" font-family="monospace" font-size="7" font-weight="900" text-anchor="middle">M2</text>
    </g>

    <!-- Côté Droit : Moteur 3 (Haut) et Moteur 4 (Bas) -->
    <g stroke="#000000" stroke-width="2">
      <!-- M3 (3 phases) -->
      <rect x="265" y="78" width="18" height="15" rx="3" fill="#ffffff" />
      <rect x="265" y="98" width="18" height="15" rx="3" fill="#ffffff" />
      <rect x="265" y="118" width="18" height="15" rx="3" fill="#ffffff" />
      <text x="274" y="90" font-family="monospace" font-size="7" font-weight="900" text-anchor="middle">M3</text>

      <!-- M4 (3 phases) -->
      <rect x="265" y="167" width="18" height="15" rx="3" fill="#ffffff" />
      <rect x="265" y="187" width="18" height="15" rx="3" fill="#ffffff" />
      <rect x="265" y="207" width="18" height="15" rx="3" fill="#ffffff" />
      <text x="274" y="179" font-family="monospace" font-size="7" font-weight="900" text-anchor="middle">M4</text>
    </g>

    <!-- GROS PADS D'ALIMENTATION BATTERIE LiPo (HAUT & BAS) -->
    <g stroke="#000000" stroke-width="2.5">
      <!-- BAT (+) en haut -->
      <rect x="120" y="17" width="28" height="22" rx="4" fill="#000000" />
      <text x="134" y="32" font-family="monospace" font-size="10" font-weight="900" fill="#ffffff" text-anchor="middle">BAT+</text>
      
      <!-- GND (-) en haut -->
      <rect x="152" y="17" width="28" height="22" rx="4" fill="#000000" />
      <text x="166" y="32" font-family="monospace" font-size="10" font-weight="900" fill="#ffffff" text-anchor="middle">GND-</text>

      <!-- Emplacement condensateur Low ESR en bas -->
      <rect x="125" y="261" width="22" height="22" rx="4" fill="#000000" />
      <text x="136" y="276" font-family="monospace" font-size="9" font-weight="900" fill="#ffffff" text-anchor="middle">C+</text>
      <rect x="153" y="261" width="22" height="22" rx="4" fill="#000000" />
      <text x="164" y="276" font-family="monospace" font-size="9" font-weight="900" fill="#ffffff" text-anchor="middle">C-</text>
    </g>

    <!-- 24 TRANSISTORS MOSFET PUISSANCE NOIRS DISPOSÉS EN 4 QUADRANTS -->
    <g fill="#000000" stroke="#000000" stroke-width="1.5">
      <!-- M1 FETs -->
      <rect x="52" y="80" width="18" height="12" rx="1.5" />
      <rect x="74" y="80" width="18" height="12" rx="1.5" />
      <rect x="52" y="98" width="18" height="12" rx="1.5" />
      <rect x="74" y="98" width="18" height="12" rx="1.5" />
      
      <!-- M2 FETs -->
      <rect x="52" y="190" width="18" height="12" rx="1.5" />
      <rect x="74" y="190" width="18" height="12" rx="1.5" />
      <rect x="52" y="208" width="18" height="12" rx="1.5" />
      <rect x="74" y="208" width="18" height="12" rx="1.5" />

      <!-- M3 FETs -->
      <rect x="208" y="80" width="18" height="12" rx="1.5" />
      <rect x="230" y="80" width="18" height="12" rx="1.5" />
      <rect x="208" y="98" width="18" height="12" rx="1.5" />
      <rect x="230" y="98" width="18" height="12" rx="1.5" />

      <!-- M4 FETs -->
      <rect x="208" y="190" width="18" height="12" rx="1.5" />
      <rect x="230" y="190" width="18" height="12" rx="1.5" />
      <rect x="208" y="208" width="18" height="12" rx="1.5" />
      <rect x="230" y="208" width="18" height="12" rx="1.5" />
    </g>

    <!-- SHUNT DE COURANT & CONNECTEUR JST-SH CENTRAL -->
    <g transform="translate(150, 150)">
      <!-- Prise nappe FC vers ESC (8 broches JST-SH) -->
      <rect x="-32" y="-18" width="64" height="24" rx="2" fill="#ffffff" stroke="#000000" stroke-width="2.5" />
      <rect x="-26" y="-14" width="52" height="16" fill="#000000" />
      
        <line x1="-21" y1="-12" x2="-21" y2="-4" stroke="#ffffff" stroke-width="1.5" />
      
        <line x1="-15" y1="-12" x2="-15" y2="-4" stroke="#ffffff" stroke-width="1.5" />
      
        <line x1="-9" y1="-12" x2="-9" y2="-4" stroke="#ffffff" stroke-width="1.5" />
      
        <line x1="-3" y1="-12" x2="-3" y2="-4" stroke="#ffffff" stroke-width="1.5" />
      
        <line x1="3" y1="-12" x2="3" y2="-4" stroke="#ffffff" stroke-width="1.5" />
      
        <line x1="9" y1="-12" x2="9" y2="-4" stroke="#ffffff" stroke-width="1.5" />
      
        <line x1="15" y1="-12" x2="15" y2="-4" stroke="#ffffff" stroke-width="1.5" />
      
        <line x1="21" y1="-12" x2="21" y2="-4" stroke="#ffffff" stroke-width="1.5" />
      

      <!-- Shunt de mesure de courant -->
      <rect x="-22" y="16" width="44" height="14" rx="2" fill="#000000" stroke="#000000" stroke-width="2" />
    </g>
  </g>
</svg>