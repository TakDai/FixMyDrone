name: Daily FPV Veille (Scan, Filter & Translate)

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  veille-scan-translate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Scan FPV Forums & GitHub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/scan_fpv_forums.mjs

      - name: Clean & Translate Subjects (FR)
        run: node scripts/fix_and_translate_posts.mjs

      - name: Prune Duplicates & Useless Subjects
        run: node scripts/prune_useless_posts.mjs

      - name: Enrich Real Discussion Threads & Replies
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/enrich_discussions.mjs

      - name: Commit & Push Updated Veille Data
        run: |
          git config user.name "FixMyDrone Veille Bot"
          git config user.email "bot@fixmydrone.fr"
          if ! git diff --quiet public/data/scanned-forum-posts.json; then
            git add public/data/scanned-forum-posts.json
            git commit -m "chore(veille): update filtered and translated FPV posts"
            git push
          else
            echo "No new veille posts to commit."
          fi
